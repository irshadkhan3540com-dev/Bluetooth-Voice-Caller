name: Build Z+2 Official Pro Browser

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Create Android Directory Structure
        run: |
          mkdir -p app/src/main/java/com/personal/probrowser
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/anim
          mkdir -p app/src/main/res/mipmap-anydpi-v26

      - name: 4. Create UI Animation Files
        run: |
          cat << 'EOF' > app/src/main/res/anim/fade_in.xml
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android">
              <alpha android:fromAlpha="0.0" android:toAlpha="1.0" android:duration="500"/>
          </set>
          EOF

      - name: 5. Design Premium Brand Identity & Colors
        run: |
          cat << 'EOF' > app/src/main/res/drawable/app_icon.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="512dp" android:height="512dp"
              android:viewportWidth="100" android:viewportHeight="100">
              <path android:pathData="M10,20 C10,12 12,10 20,10 L80,10 C88,10 90,12 90,20 L90,80 C90,88 88,90 80,90 L20,90 C12,90 10,88 10,80 Z" android:fillColor="#03071E"/>
              <path android:pathData="M25,25 L75,25 L75,55 C75,68 62,78 50,83 C38,78 25,68 25,55 Z" android:strokeColor="#00E5FF" android:strokeWidth="2.5" android:fillColor="#0A1128"/>
              <path android:pathData="M65,33 L35,33 L35,43 L53,43 L35,67 L65,67 L65,57 L47,57 Z" android:fillColor="#FFD000"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/bg_deep_galactic"/>
              <foreground android:drawable="@drawable/app_icon"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/card_neon_glow.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#0A1128"/>
              <corners android:radius="20dp"/>
              <stroke android:width="2dp" android:color="#00E5FF"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Z + 2 Browser</string>
              <string name="header_name">Zeeshan Z+2</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="bg_deep_galactic">#03071E</color>
              <color name="neon_cyan">#00E5FF</color>
              <color name="cyber_gold">#FFD000</color>
              <color name="pure_white">#FFFFFF</color>
          </resources>
          EOF

      - name: 6. Build VIP UI Layouts (Splash, 2x2 Grid, Cinema Vault)
        run: |
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg_deep_galactic">

              <!-- SPLASH SCREEN -->
              <LinearLayout
                  android:id="@+id/splashScreen"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:gravity="center"
                  android:orientation="vertical"
                  android:background="@color/bg_deep_galactic"
                  android:visibility="visible">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Z + 2 Browser"
                      android:textSize="36sp"
                      android:textStyle="bold"
                      android:textColor="@color/neon_cyan"/>
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Engine Starting..."
                      android:textSize="14sp"
                      android:textColor="@color/cyber_gold"
                      android:layout_marginTop="10dp"/>
              </LinearLayout>

              <!-- MAIN DASHBOARD -->
              <LinearLayout
                  android:id="@+id/mainDashboard"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical"
                  android:visibility="gone">
                  
                  <!-- TOP BRAND HEADER -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="60dp"
                      android:background="#0A1128"
                      android:gravity="center_vertical"
                      android:padding="15dp"
                      android:elevation="10dp">
                      <TextView
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="@string/header_name"
                          android:textSize="22sp"
                          android:textStyle="bold"
                          android:textColor="@color/cyber_gold"/>
                      <ImageView
                          android:layout_width="15dp"
                          android:layout_height="15dp"
                          android:src="@android:drawable/presence_online"
                          android:contentDescription="Secure Engine Live"/>
                  </LinearLayout>

                  <ScrollView
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:padding="20dp">
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical">
                          
                          <!-- SEARCH BAR -->
                          <EditText
                              android:id="@+id/searchBarHome"
                              android:layout_width="match_parent"
                              android:layout_height="60dp"
                              android:background="@drawable/card_neon_glow"
                              android:hint="Search Google or Enter URL..."
                              android:textColorHint="#A0AAB5"
                              android:textColor="@color/pure_white"
                              android:padding="15dp"
                              android:singleLine="true"/>
                              
                          <Button
                              android:id="@+id/btnLaunchSearch"
                              android:layout_width="match_parent"
                              android:layout_height="60dp"
                              android:layout_marginTop="15dp"
                              android:text="TURBO SEARCH"
                              android:backgroundTint="@color/neon_cyan"
                              android:textColor="#03071E"
                              android:textStyle="bold"/>

                          <!-- 2x2 CORPORATE GRID -->
                          <GridLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="30dp"
                              android:columnCount="2"
                              android:rowCount="2"
                              android:alignmentMode="alignMargins"
                              android:columnOrderPreserved="false">
                              
                              <Button
                                  android:id="@+id/btnGridYoutube"
                                  android:layout_width="0dp"
                                  android:layout_height="80dp"
                                  android:layout_columnWeight="1"
                                  android:layout_margin="5dp"
                                  android:text="YOUTUBE"
                                  android:backgroundTint="#0A1128"
                                  android:textColor="@color/pure_white"/>
                                  
                              <Button
                                  android:id="@+id/btnGridVault"
                                  android:layout_width="0dp"
                                  android:layout_height="80dp"
                                  android:layout_columnWeight="1"
                                  android:layout_margin="5dp"
                                  android:text="DOWNLOAD VAULT"
                                  android:backgroundTint="#0A1128"
                                  android:textColor="@color/cyber_gold"/>
                                  
                              <Button
                                  android:id="@+id/btnGridFacebook"
                                  android:layout_width="0dp"
                                  android:layout_height="80dp"
                                  android:layout_columnWeight="1"
                                  android:layout_margin="5dp"
                                  android:text="SOCIAL"
                                  android:backgroundTint="#0A1128"
                                  android:textColor="@color/pure_white"/>
                                  
                              <Button
                                  android:id="@+id/btnGridSettings"
                                  android:layout_width="0dp"
                                  android:layout_height="80dp"
                                  android:layout_columnWeight="1"
                                  android:layout_margin="5dp"
                                  android:text="PERMISSIONS"
                                  android:backgroundTint="#0A1128"
                                  android:textColor="@color/neon_cyan"/>
                          </GridLayout>

                          <TextView
                              android:id="@+id/networkStatusText"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="40dp"
                              android:gravity="center"
                              android:text="Checking Engines..."
                              android:textColor="@color/neon_cyan"/>
                      </LinearLayout>
                  </ScrollView>
              </LinearLayout>

              <!-- LIVE WEBVIEW SCREEN -->
              <LinearLayout
                  android:id="@+id/screenBrowser"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical"
                  android:visibility="gone">
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="50dp"
                      android:background="#0A1128"
                      android:orientation="horizontal">
                      <Button android:id="@+id/btnBrowserBack" android:layout_width="50dp" android:layout_height="match_parent" android:text="◀" android:backgroundTint="@color/neon_cyan" android:textColor="#000"/>
                      <TextView android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:text="Zeeshan Secure Engine Active" android:textColor="@color/pure_white" android:gravity="center" android:textStyle="bold"/>
                      <Button android:id="@+id/btnCloseBrowser" android:layout_width="50dp" android:layout_height="match_parent" android:text="✖" android:backgroundTint="#E74C3C" android:textColor="#FFF"/>
                  </LinearLayout>
                  <ProgressBar android:id="@+id/webProgress" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="4dp" android:progressTint="@color/neon_cyan"/>
                  <WebView android:id="@+id/webViewCore" android:layout_width="match_parent" android:layout_height="match_parent"/>
              </LinearLayout>

              <!-- CINEMATIC MEDIA VAULT -->
              <LinearLayout
                  android:id="@+id/screenVault"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical"
                  android:background="@color/bg_deep_galactic"
                  android:visibility="gone"
                  android:padding="20dp">
                  <Button android:id="@+id/btnVaultHome" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="◀ BACK TO HOME" android:backgroundTint="@color/neon_cyan" android:textColor="#000"/>
                  
                  <!-- BUG FIXED HERE: Replaced & with &amp; -->
                  <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Turbo Downloads &amp; Media" android:textColor="@color/cyber_gold" android:textSize="20sp" android:textStyle="bold" android:layout_marginTop="20dp"/>
                  <ProgressBar android:id="@+id/downloadProgress" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="10dp" android:layout_marginTop="10dp" android:progressTint="@color/neon_cyan"/>
                  
                  <!-- Glassmorphism Video Player -->
                  <FrameLayout
                      android:layout_width="match_parent"
                      android:layout_height="250dp"
                      android:layout_marginTop="30dp"
                      android:background="@drawable/card_neon_glow"
                      android:padding="5dp">
                      <VideoView android:id="@+id/internalVideoView" android:layout_width="match_parent" android:layout_height="match_parent" android:layout_gravity="center"/>
                  </FrameLayout>
                  <Button android:id="@+id/btnPlayRecent" android:layout_width="match_parent" android:layout_height="60dp" android:layout_marginTop="20dp" android:text="PLAY LAST DOWNLOADED FILE" android:backgroundTint="@color/cyber_gold" android:textColor="#000" android:textStyle="bold"/>
              </LinearLayout>
          </FrameLayout>
          EOF

      - name: 7. Master Engine Java Assembly (Ad-Blocker, No Limits, Multi-Thread, WakeLock)
        run: |
          cat << 'EOF' > app/src/main/java/com/personal/probrowser/MainActivity.java
          package com.personal.probrowser;

          import android.Manifest;
          import android.app.AlertDialog;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.net.wifi.WifiManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.app.NotificationCompat;
          import java.io.*;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends AppCompatActivity {
              private LinearLayout splashScreen, mainDashboard, screenBrowser, screenVault;
              private EditText searchBarHome;
              private WebView webViewCore;
              private ProgressBar webProgress, downloadProgress;
              private VideoView internalVideoView;
              private TextView networkStatusText;
              private Button btnLaunchSearch, btnGridYoutube, btnGridVault, btnGridFacebook, btnGridSettings;
              private Button btnBrowserBack, btnCloseBrowser, btnVaultHome, btnPlayRecent;

              private String lastDownloadedFile = "";
              private NotificationManager notificationManager;
              private PowerManager.WakeLock wakeLock;
              private WifiManager.WifiLock wifiLock;
              private ExecutorService downloadEnginePool = Executors.newFixedThreadPool(8);

              private static final int PERMISSION_REQ_CODE = 1001;

              // AD BLOCKER DOMAINS LIST
              private final String[] AD_HOSTS = {
                  "doubleclick.net", "adservice.google.com", "googlesyndication.com",
                  "adnxs.com", "criteo.com", "adform.net", "popads.net", "propellerads.com"
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  splashScreen = findViewById(R.id.splashScreen);
                  mainDashboard = findViewById(R.id.mainDashboard);
                  screenBrowser = findViewById(R.id.screenBrowser);
                  screenVault = findViewById(R.id.screenVault);

                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      splashScreen.setVisibility(View.GONE);
                      mainDashboard.setVisibility(View.VISIBLE);
                      checkAndRequestPermissions();
                  }, 2000);

                  initViews();
                  setupEngines();
                  setupClickListeners();
                  configureTurboBrowser();
              }

              private void initViews() {
                  searchBarHome = findViewById(R.id.searchBarHome);
                  webViewCore = findViewById(R.id.webViewCore);
                  webProgress = findViewById(R.id.webProgress);
                  downloadProgress = findViewById(R.id.downloadProgress);
                  internalVideoView = findViewById(R.id.internalVideoView);
                  networkStatusText = findViewById(R.id.networkStatusText);
                  
                  btnLaunchSearch = findViewById(R.id.btnLaunchSearch);
                  btnGridYoutube = findViewById(R.id.btnGridYoutube);
                  btnGridVault = findViewById(R.id.btnGridVault);
                  btnGridFacebook = findViewById(R.id.btnGridFacebook);
                  btnGridSettings = findViewById(R.id.btnGridSettings);
                  btnBrowserBack = findViewById(R.id.btnBrowserBack);
                  btnCloseBrowser = findViewById(R.id.btnCloseBrowser);
                  btnVaultHome = findViewById(R.id.btnVaultHome);
                  btnPlayRecent = findViewById(R.id.btnPlayRecent);
              }

              private void checkAndRequestPermissions() {
                  String[] permissions = {
                      Manifest.permission.WRITE_EXTERNAL_STORAGE,
                      Manifest.permission.READ_EXTERNAL_STORAGE
                  };
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      permissions = new String[]{ Manifest.permission.POST_NOTIFICATIONS };
                  }
                  
                  boolean needsPermission = false;
                  for (String p : permissions) {
                      if (ActivityCompat.checkSelfPermission(this, p) != PackageManager.PERMISSION_GRANTED) {
                          needsPermission = true; break;
                      }
                  }

                  if (needsPermission) {
                      ActivityCompat.requestPermissions(this, permissions, PERMISSION_REQ_CODE);
                  } else {
                      activateHardwareLocks();
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  boolean allGranted = true;
                  for (int res : grantResults) {
                      if (res != PackageManager.PERMISSION_GRANTED) { allGranted = false; break; }
                  }
                  
                  if (!allGranted) {
                      new AlertDialog.Builder(this)
                          .setTitle("Engine Access Required")
                          .setMessage("Z+2 requires Full Storage & Network access to download 1GB+ files. Please tap ALLOW in settings.")
                          .setPositiveButton("GO TO SETTINGS", (dialog, which) -> {
                              Intent intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                              Uri uri = Uri.fromParts("package", getPackageName(), null);
                              intent.setData(uri);
                              startActivity(intent);
                          })
                          .setCancelable(false)
                          .show();
                  } else {
                      activateHardwareLocks();
                  }
              }

              private void activateHardwareLocks() {
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "ZPlus::DownloadWakeLock");
                      wakeLock.acquire(10 * 60 * 1000L); 

                      WifiManager wm = (WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                      wifiLock = wm.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "ZPlus::HotspotTurboLock");
                      wifiLock.acquire();

                      networkStatusText.setText("ENGINES ACTIVE: 4G/Hotspot Hardware Locked & Boosted");
                      networkStatusText.setTextColor(android.graphics.Color.parseColor("#2ECC71"));
                  } catch (Exception e) {
                      networkStatusText.setText("Engine Lock Pending Permissions");
                  }
              }

              private void setupEngines() {
                  notificationManager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel("Z_TURBO", "Z+2 Turbo Engine", NotificationManager.IMPORTANCE_HIGH);
                      notificationManager.createNotificationChannel(ch);
                  }
              }

              private void setupClickListeners() {
                  btnLaunchSearch.setOnClickListener(v -> loadUrl(searchBarHome.getText().toString()));
                  btnGridYoutube.setOnClickListener(v -> loadUrl("https://youtube.com"));
                  btnGridFacebook.setOnClickListener(v -> loadUrl("https://facebook.com"));
                  
                  btnGridVault.setOnClickListener(v -> {
                      mainDashboard.setVisibility(View.GONE);
                      screenVault.setVisibility(View.VISIBLE);
                  });
                  btnVaultHome.setOnClickListener(v -> {
                      screenVault.setVisibility(View.GONE);
                      mainDashboard.setVisibility(View.VISIBLE);
                  });
                  btnGridSettings.setOnClickListener(v -> checkAndRequestPermissions());
                  
                  btnCloseBrowser.setOnClickListener(v -> {
                      webViewCore.loadUrl("about:blank");
                      screenBrowser.setVisibility(View.GONE);
                      mainDashboard.setVisibility(View.VISIBLE);
                  });
                  btnBrowserBack.setOnClickListener(v -> {
                      if(webViewCore.canGoBack()) webViewCore.goBack();
                  });

                  btnPlayRecent.setOnClickListener(v -> {
                      if (!lastDownloadedFile.isEmpty()) {
                          File f = new File(lastDownloadedFile);
                          if(f.exists()) {
                              internalVideoView.setVideoURI(Uri.fromFile(f));
                              MediaController mc = new MediaController(this);
                              internalVideoView.setMediaController(mc);
                              internalVideoView.start();
                          }
                      } else {
                          Toast.makeText(this, "No media downloaded yet", Toast.LENGTH_SHORT).show();
                      }
                  });
              }

              private void loadUrl(String query) {
                  if(query.isEmpty()) return;
                  if (!query.startsWith("http")) query = "https://www.google.com/search?q=" + query;
                  mainDashboard.setVisibility(View.GONE);
                  screenBrowser.setVisibility(View.VISIBLE);
                  webViewCore.loadUrl(query);
              }

              private void configureTurboBrowser() {
                  WebSettings s = webViewCore.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setUseWideViewPort(true);

                  webViewCore.setWebViewClient(new WebViewClient() {
                      // IN-BUILT AD BLOCKER ENGINE
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString().toLowerCase();
                          for (String adHost : AD_HOSTS) {
                              if (url.contains(adHost)) {
                                  // Block the Ad request by returning empty data
                                  return new WebResourceResponse("text/plain", "UTF-8", new ByteArrayInputStream("".getBytes()));
                              }
                          }
                          return super.shouldInterceptRequest(view, request);
                      }
                  });
                  
                  webViewCore.setWebChromeClient(new WebChromeClient() {
                      public void onProgressChanged(WebView v, int p) {
                          webProgress.setProgress(p);
                          webProgress.setVisibility(p == 100 ? View.GONE : View.VISIBLE);
                      }
                  });

                  webViewCore.setDownloadListener((url, userAgent, contentDisposition, mimetype, contentLength) -> {
                      Toast.makeText(MainActivity.this, "Z+2 Turbo Engine Starting Download...", Toast.LENGTH_LONG).show();
                      startMultiThreadedDownload(url, contentDisposition);
                  });
              }

              private void startMultiThreadedDownload(String fileUrl, String contentDisp) {
                  downloadEnginePool.execute(() -> {
                      try {
                          URL url = new URL(fileUrl);
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.connect();

                          String fileName = "Z_Plus_" + System.currentTimeMillis();
                          if(contentDisp != null && contentDisp.contains("filename=")) {
                              fileName = contentDisp.split("filename=")[1].replace("\"", "");
                          } else if (fileUrl.contains("/")) {
                              fileName = fileUrl.substring(fileUrl.lastIndexOf('/') + 1);
                          }

                          File targetDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                          File file = new File(targetDir, fileName);
                          lastDownloadedFile = file.getAbsolutePath();

                          InputStream input = conn.getInputStream();
                          FileOutputStream output = new FileOutputStream(file);

                          byte[] buffer = new byte[262144]; 
                          int bytesRead;
                          long total = 0;
                          long fileLength = conn.getContentLength();

                          runOnUiThread(() -> downloadProgress.setProgress(0));

                          NotificationCompat.Builder builder = new NotificationCompat.Builder(MainActivity.this, "Z_TURBO")
                                  .setSmallIcon(android.R.drawable.stat_sys_download)
                                  .setContentTitle("Z+2 Downloading: " + fileName)
                                  .setOngoing(true);

                          int lastProgress = 0;
                          while ((bytesRead = input.read(buffer)) != -1) {
                              total += bytesRead;
                              output.write(buffer, 0, bytesRead);
                              
                              if (fileLength > 0) {
                                  int progress = (int) (total * 100 / fileLength);
                                  if (progress > lastProgress) {
                                      lastProgress = progress;
                                      builder.setProgress(100, progress, false);
                                      notificationManager.notify(1, builder.build());
                                      final int p = progress;
                                      runOnUiThread(() -> downloadProgress.setProgress(p));
                                  }
                              }
                          }
                          
                          output.close();
                          input.close();

                          builder.setContentText("Download Complete").setProgress(0,0,false).setOngoing(false);
                          notificationManager.notify(1, builder.build());
                          
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Z+2 Turbo Download 100% Complete!", Toast.LENGTH_LONG).show());

                      } catch (Exception e) {
                          e.printStackTrace();
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Download Failed: " + e.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  });
              }

              @Override
              protected void onDestroy() {
                  if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
                  if (wifiLock != null && wifiLock.isHeld()) wifiLock.release();
                  downloadEnginePool.shutdown();
                  super.onDestroy();
              }
          }
          EOF

      - name: 8. Write Secure Manifest with Maximum Matrix Permissions
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              
              <!-- MAXIMUM PERMISSION MATRIX -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:requestLegacyExternalStorage="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: 9. Setup Gradle Compilation Matrix Settings
        run: |
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4g
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include ':app'
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.personal.probrowser'
              compileSdk 34

              defaultConfig {
                  applicationId "com.personal.probrowser"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "2.0 Z+2"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      - name: 10. Execute Engine Build & Compile APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 11. Dispatch Output Package to Artifacts Storage
        uses: actions/upload-artifact@v4
        with:
          name: Z-Plus-Turbo-Browser-Package
          path: app/build/outputs/apk/debug/*.apk

