name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android NDK and CMake
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

    - name: Setup Gradle Build Tool
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Compile and Build Debug APK
      run: gradle assembleDebug

    # यह है वो जरूरी कमांड जो डाउनलोड बटन वापस लाएगा
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Bluetooth-Caller-APK
        path: app/build/outputs/apk/debug/app-debug.apk

